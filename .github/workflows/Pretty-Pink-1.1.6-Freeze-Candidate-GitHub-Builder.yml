      - name: Verify freeze-candidate identity and invariants
        shell: bash
        run: |
          grep -Fq "applicationId 'com.prettypink.player.freezecandidate'" app/build.gradle
          grep -Fq "versionName '1.1.6-freeze-candidate'" app/build.gradle
          grep -Fq 'MEASUREMENT_SCHEMA_VERSION=5' app/src/main/java/com/prettypink/player/AnalysisCache.java
          grep -Fq 'smooth((hotWindows - 3.0) / 6.0)' app/src/main/java/com/prettypink/player/GainPolicy.java
          grep -Fq 'AudioFormat.ENCODING_PCM_FLOAT' app/src/main/java/com/prettypink/player/Scanner.java
          grep -Fq 'return PrettyPink.FALLBACK_ATTENUATION_DB' app/src/main/java/com/prettypink/player/GainPolicy.java
          echo 'PASS freeze-candidate identity and invariant anchors'

      - name: Run host policy and math checks
        shell: bash
        run: |
          rm -rf /tmp/ppfreezecheck
          mkdir -p /tmp/ppfreezecheck
          javac --release 8 -d /tmp/ppfreezecheck \
            app/src/main/java/com/prettypink/player/PrettyPink.java \
            app/src/main/java/com/prettypink/player/GainPolicy.java \
            app/src/main/java/com/prettypink/player/ScanResult.java \
            app/src/main/java/com/prettypink/player/Loudness.java \
            app/src/main/java/com/prettypink/player/PeakMeter.java \
            app/src/main/java/com/prettypink/player/AlbumPolicy.java \
            app/src/main/java/com/prettypink/player/Pcm.java \
            app/src/main/java/com/prettypink/player/FlacInfo.java \
            tests/AudioCheck.java \
            tests/GainCheck.java \
            tests/PrettyPinkCheck.java \
            tests/BalanceCurveCheck.java \
            tests/V03IntegrationCheck.java
          java -cp /tmp/ppfreezecheck com.prettypink.player.AudioCheck
          java -cp /tmp/ppfreezecheck GainCheck
          java -cp /tmp/ppfreezecheck com.prettypink.player.PrettyPinkCheck
          java -cp /tmp/ppfreezecheck com.prettypink.player.BalanceCurveCheck
          java -cp /tmp/ppfreezecheck com.prettypink.player.V03IntegrationCheck

      - name: Refuse private keys or test music
        shell: bash
        run: |
          if find . -type f \( -iname '*.p12' -o -iname '*.jks' -o -iname '*.keystore' -o -iname '*.flac' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.wav' \) -print -quit | grep -q .; then
            echo 'Refusing to build: private key or test media found in candidate workspace.' >&2
            exit 1
          fi
          echo 'PASS no private keys or test music in build workspace'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Ensure Android SDK 35 is installed
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build isolated debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name and hash the APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pretty-Pink-1.1.6-Freeze-Candidate.apk
          sha256sum Pretty-Pink-1.1.6-Freeze-Candidate.apk | tee Pretty-Pink-1.1.6-Freeze-Candidate.sha256

      - name: Upload the APK and checksum
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Pretty-Pink-1.1.6-Freeze-Candidate
          path: |
            Pretty-Pink-1.1.6-Freeze-Candidate.apk
            Pretty-Pink-1.1.6-Freeze-Candidate.sha256
          if-no-files-found: error
          retention-days: 7
