      - name: Keep paused session alive and publish active output route
        shell: bash
        run: |
          python3 - <<'PY_PAUSE_ROUTE'
          from pathlib import Path
          import hashlib
          p=Path('app/src/main/java/com/prettypink/player/PlayerService.java')
          before=p.read_text()
          
          before_hash=hashlib.sha256(before.encode()).hexdigest()
          if before_hash != 'd3cbc48a79a8f7ba48f55e1eb4a1cef94f43ed80134eb133191458414c622939':
              raise SystemExit(f'Unexpected PlayerService baseline before pause/route patch: {before_hash}')
          
          s=before
          changes=[]
          def change(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected exactly one target, found {n}')
              s=s.replace(old,new,1)
              changes.append((old,new,label))
          
          old='private MediaPlayer player;private MediaSession session;private AudioManager audio;private AudioFocusRequest focus;'
          new=old+'public String outputRoute="Output route pending";'
          change(old,new,'route field')
          
          old='private final Handler main=new Handler(Looper.getMainLooper());private final ExecutorService scans=Executors.newSingleThreadExecutor();private volatile int generation;private Future<?> scan;'
          new=old+'''\n // PP_ROUTE_AWARENESS_BEGIN
           private final AudioRouting.OnRoutingChangedListener routeChanged=router->{try{updateOutputRoute(router==null?null:router.getRoutedDevice());}catch(Throwable ignored){}};
           private final AudioDeviceCallback routeDevices=new AudioDeviceCallback(){@Override public void onAudioDevicesRemoved(AudioDeviceInfo[] removed){if(removed==null)return;for(AudioDeviceInfo d:removed){String n=outputName(d);if(n.equals(outputRoute)){outputRoute="Output route pending";if(!closing)notifyPlayer();break;}}}};
           // PP_ROUTE_AWARENESS_END'''
          change(old,new,'route listeners')
          
          old='audio=(AudioManager)getSystemService(AUDIO_SERVICE);focus=new AudioFocusRequest.Builder'
          new='audio=(AudioManager)getSystemService(AUDIO_SERVICE);if(Build.VERSION.SDK_INT>=23)audio.registerAudioDeviceCallback(routeDevices,main);focus=new AudioFocusRequest.Builder'
          change(old,new,'register device callback')
          
          old='private AudioAttributes attributes(){return new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build();}'
          new=old+'''\n // PP_ROUTE_HELPERS_BEGIN
           private String outputName(AudioDeviceInfo d){if(d==null)return "Output route pending";CharSequence raw=d.getProductName();String n=raw==null?"":raw.toString().trim();if(n.length()>0&&!"unknown".equalsIgnoreCase(n))return n;switch(d.getType()){case AudioDeviceInfo.TYPE_BLUETOOTH_A2DP:return "Bluetooth audio";case AudioDeviceInfo.TYPE_BLUETOOTH_SCO:return "Bluetooth headset";case AudioDeviceInfo.TYPE_WIRED_HEADPHONES:return "Wired headphones";case AudioDeviceInfo.TYPE_WIRED_HEADSET:return "Wired headset";case AudioDeviceInfo.TYPE_USB_DEVICE:case AudioDeviceInfo.TYPE_USB_HEADSET:return "USB audio";case AudioDeviceInfo.TYPE_BUILTIN_SPEAKER:return "Phone speaker";default:return "Audio output";}}
           private void updateOutputRoute(AudioDeviceInfo d){if(d==null)return;String n=outputName(d);if(n.equals(outputRoute))return;outputRoute=n;if(!closing)notifyPlayer();}
           private void refreshOutputRoute(){if(Build.VERSION.SDK_INT<28||player==null||!playing())return;try{updateOutputRoute(player.getRoutedDevice());}catch(Throwable ignored){}}
           // PP_ROUTE_HELPERS_END'''
          change(old,new,'route helpers')
          
          old='public int onStartCommand(Intent i,int flags,int id){if(closing)return START_NOT_STICKY;notifyPlayer();if(i!=null){String a=i.getAction();if("pause".equals(a))toggle();else if("next".equals(a))next(1);else if("stop".equals(a))stopPlayback();}return START_NOT_STICKY;}'
          new='public int onStartCommand(Intent i,int flags,int id){if(closing)return START_NOT_STICKY;notifyPlayer();if(i!=null){String a=i.getAction();if("pause".equals(a))toggle();else if("next".equals(a))next(1);else if("stop".equals(a))stopPlayback();}return START_STICKY;}'
          change(old,new,'sticky service')
          
          old='player=new MediaPlayer();final Uri uri=queue.get(at);'
          new='player=new MediaPlayer();if(Build.VERSION.SDK_INT>=28)try{player.addOnRoutingChangedListener(routeChanged,main);}catch(Throwable ignored){}final Uri uri=queue.get(at);'
          change(old,new,'routing listener registration')
          
          old='player.start();hasStarted=true;}else if(!player.isPlaying()){applyVerifiedBoundary();player.start();}notifyPlayer();'
          new='player.start();hasStarted=true;refreshOutputRoute();main.postDelayed(()->refreshOutputRoute(),250);}else if(!player.isPlaying()){applyVerifiedBoundary();player.start();refreshOutputRoute();main.postDelayed(()->refreshOutputRoute(),250);}notifyPlayer();'
          change(old,new,'refresh routed device')
          
          old='.putString(android.media.MediaMetadata.METADATA_KEY_ARTIST, artist)\n          .putLong(android.media.MediaMetadata.METADATA_KEY_DURATION, duration());'
          new='.putString(android.media.MediaMetadata.METADATA_KEY_ARTIST, artist)\n          .putString(android.media.MediaMetadata.METADATA_KEY_DISPLAY_DESCRIPTION, "Output · " + outputRoute)\n          .putLong(android.media.MediaMetadata.METADATA_KEY_DURATION, duration());'
          change(old,new,'route metadata')
          
          old='Notification n=new Notification.Builder(this,"music").setContentTitle(title).setContentText(waiting()?status:artist).setSmallIcon'
          new='Notification n=new Notification.Builder(this,"music").setContentTitle(title).setContentText(waiting()?status:artist).setSubText("Output · "+outputRoute).setSmallIcon'
          change(old,new,'notification route label')
          
          old='.setOngoing(playing||waiting()).build();startForeground(7,n);'
          new='.setOngoing(index>=0||playing||waiting()).build();startForeground(7,n);'
          change(old,new,'paused notification retention')
          
          old='@Override public void onTaskRemoved(Intent rootIntent){closePlayer();super.onTaskRemoved(rootIntent);}'
          new='@Override public void onTaskRemoved(Intent rootIntent){if(!closing)notifyPlayer();super.onTaskRemoved(rootIntent);}'
          change(old,new,'task removal retention')
          
          old='public void onDestroy(){closing=true;unregisterReceiver(noisy);generation++;'
          new='public void onDestroy(){closing=true;unregisterReceiver(noisy);if(Build.VERSION.SDK_INT>=23)try{audio.unregisterAudioDeviceCallback(routeDevices);}catch(Throwable ignored){}generation++;'
          change(old,new,'route callback teardown')
          
          restored=s
          for old,new,label in reversed(changes):
              if restored.count(new)!=1:
                  raise SystemExit(f'{label}: reverse proof could not find unique patched form')
              restored=restored.replace(new,old,1)
          if restored != before:
              raise SystemExit('Pause/route patch changed PlayerService outside approved edits')
          
          p.write_text(s)
          after_hash=hashlib.sha256(s.encode()).hexdigest()
          if after_hash != '51b33f35fa07f9f8f7bfaeec55fe9170cb87bb22d7202296a44695805d7ab935':
              raise SystemExit(f'Unexpected patched PlayerService hash: {after_hash}')
          print('PASS pause/session retention + routed-device awareness patch reverse-proves exactly')
          print('PASS PlayerService SHA-256', after_hash)
          PY_PAUSE_ROUTE

          grep -Fq 'return START_STICKY;' app/src/main/java/com/prettypink/player/PlayerService.java
          grep -Fq 'addOnRoutingChangedListener(routeChanged,main)' app/src/main/java/com/prettypink/player/PlayerService.java
          grep -Fq 'METADATA_KEY_DISPLAY_DESCRIPTION, "Output · " + outputRoute' app/src/main/java/com/prettypink/player/PlayerService.java
          grep -Fq 'setOngoing(index>=0||playing||waiting())' app/src/main/java/com/prettypink/player/PlayerService.java
          grep -Fq 'onTaskRemoved(Intent rootIntent){if(!closing)notifyPlayer()' app/src/main/java/com/prettypink/player/PlayerService.java
          echo 'PASS lifecycle/device-route experiment installed without touching recurrence or DSP math'
          python3 - <<'PY_WRAPPER_CHECK'
          from pathlib import Path
          p=Path('app/src/main/java/com/prettypink/player/PlayerService.java')
          t=p.read_text()
          required=[
              'return START_STICKY;',
              'addOnRoutingChangedListener(routeChanged,main)',
              'METADATA_KEY_DISPLAY_DESCRIPTION, "Output · " + outputRoute',
              'setOngoing(index>=0||playing||waiting())',
              'onTaskRemoved(Intent rootIntent){if(!closing)notifyPlayer()'
          ]
          missing=[x for x in required if x not in t]
          if missing:
              raise SystemExit('Lifecycle/route wrapper self-check missing: '+repr(missing))
          print('PASS repaired v2b wrapper executed the PlayerService patch rather than treating Python as Bash')
          PY_WRAPPER_CHECK

      - name: Refuse private keys or test music
        shell: bash
        run: |
          if find . -type f \( -iname '*.p12' -o -iname '*.jks' -o -iname '*.keystore' -o -iname '*.flac' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.wav' \) -print -quit | grep -q .; then
            echo 'Refusing to build: private key or test media found in candidate workspace.' >&2
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Ensure Android SDK 35 is installed
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build isolated debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name and hash APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pretty-Pink-1.1.8-Recurrence-Lab-v2b.apk
          sha256sum Pretty-Pink-1.1.8-Recurrence-Lab-v2b.apk > Pretty-Pink-1.1.8-Recurrence-Lab-v2b.sha256
          cat Pretty-Pink-1.1.8-Recurrence-Lab-v2b.sha256

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Pretty-Pink-1.1.8-Recurrence-Lab-v2b
          path: |
            Pretty-Pink-1.1.8-Recurrence-Lab-v2b.apk
            Pretty-Pink-1.1.8-Recurrence-Lab-v2b.sha256
          if-no-files-found: error
          retention-days: 7
