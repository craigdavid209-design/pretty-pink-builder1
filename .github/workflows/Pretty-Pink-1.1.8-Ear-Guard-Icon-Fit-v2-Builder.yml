name: Pretty Pink 1.1.8 Ear Guard Icon Fit v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/Pretty-Pink-1.1.8-Ear-Guard-Icon-Fit-v2-Builder.yml'
      - '.github/workflows/Pretty-Pink-Glossy-Icon-Balanced.png'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out builder repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Restore exact tested 1.1.8 Ear Guard source
        shell: bash
        run: |
          awk '/cat > source.tar.xz.b64/{flag=1;next} flag && /PRETTY_PINK_SOURCE/{exit} flag {sub(/^          /,""); print}' \
            .github/workflows/Pretty-Pink-1.1.8-Ear-Guard-Candidate-GitHub-Builder.yml > source.tar.xz.b64
          test -s source.tar.xz.b64
          base64 -d source.tar.xz.b64 > source.tar.xz
          tar -xJf source.tar.xz
          rm -f source.tar.xz source.tar.xz.b64

      - name: Verify we really restored 1.1.8 Ear Guard
        shell: bash
        run: |
          grep -Fq "applicationId 'com.prettypink.player.earguard'" app/build.gradle
          grep -Fq "versionName '1.1.8-ear-guard-candidate'" app/build.gradle
          grep -Fq 'android:label="Pretty Pink Ear Guard"' app/src/main/AndroidManifest.xml
          grep -Fq 'MEASUREMENT_SCHEMA_VERSION=5' app/src/main/java/com/prettypink/player/AnalysisCache.java
          grep -Fq 'section + 1.80' app/src/main/java/com/prettypink/player/GainPolicy.java
          grep -Fq 'fastExcess * .55 * fastConfidence' app/src/main/java/com/prettypink/player/GainPolicy.java
          grep -Fq 'target <= -20.0 ? 0.85 : 1.0' app/src/main/java/com/prettypink/player/GainPolicy.java
          echo 'PASS exact 1.1.8 Ear Guard identity/invariants'

      - name: Freeze audio code and in-app UI before icon patch
        shell: bash
        run: |
          find app/src/main/java -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/java-before.sha256

          # Preserve every pre-existing resource except launcher resources that this
          # test intentionally replaces. This protects the older in-app icons/art.
          find app/src/main/res -type f \
            ! -path '*/mipmap-anydpi/launcher.xml' \
            ! -path '*/mipmap-anydpi/launcher_round.xml' \
            ! -path '*/mipmap-anydpi-v26/launcher.xml' \
            ! -path '*/mipmap-anydpi-v26/launcher_round.xml' \
            ! -path '*/drawable/glossy_launcher.xml' \
            ! -path '*/drawable/glossy_launcher_fill.xml' \
            ! -path '*/drawable-nodpi/glossy_music_icon.png' \
            -print0 | sort -z | xargs -0 sha256sum > /tmp/res-before.sha256

      - name: Prepare fitted Pretty Pink artwork
        shell: bash
        run: |
          test -f .github/workflows/Pretty-Pink-Glossy-Icon-Balanced.png
          mkdir -p app/src/main/res/drawable-nodpi

          cat > /tmp/IconFit.java <<'JAVA'
          import java.awt.Graphics2D;
          import java.awt.RenderingHints;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;

          public final class IconFit {
            public static void main(String[] args) throws Exception {
              BufferedImage src = ImageIO.read(new File(args[0]));
              if (src == null) throw new IllegalStateException("Could not decode Pretty Pink icon");
              if (src.getWidth() != src.getHeight()) {
                throw new IllegalStateException("Pretty Pink icon must be square");
              }

              // Balanced artwork already has gentle breathing room. Crop only a
              // little of it back (~96% visible-art scale), then let the adaptive
              // BACKGROUND fill Samsung's entire mask. The important fix is that
              // the completed square is no longer used as an adaptive foreground,
              // where Android applies an additional safe-zone shrink.
              int w = src.getWidth();
              int crop = Math.max(1, Math.round(w * 0.031f));
              int edge = w - crop * 2;

              BufferedImage dst = new BufferedImage(w, w, BufferedImage.TYPE_INT_ARGB);
              Graphics2D g = dst.createGraphics();
              g.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC);
              g.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY);
              g.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
              g.drawImage(src, 0, 0, w, w, crop, crop, crop + edge, crop + edge, null);
              g.dispose();

              if (!ImageIO.write(dst, "png", new File(args[1]))) {
                throw new IllegalStateException("PNG writer unavailable");
              }
            }
          }
          JAVA

          javac /tmp/IconFit.java
          java -Djava.awt.headless=true -cp /tmp IconFit \
            .github/workflows/Pretty-Pink-Glossy-Icon-Balanced.png \
            app/src/main/res/drawable-nodpi/glossy_music_icon.png

      - name: Apply Samsung launcher-only fit patch
        shell: bash
        run: |
          cat > /tmp/icon_patch.py <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle')
          s = gradle.read_text()

          # Isolated test package so it can coexist with the normal 1.1.8 candidate.
          s, n = re.subn(
              r"applicationId\s+'com\.prettypink\.player\.earguard'",
              "applicationId 'com.prettypink.player.earguard.iconfitv2'",
              s, count=1
          )
          if n != 1:
              raise SystemExit('Could not patch 1.1.8 Ear Guard applicationId')

          m = re.search(r'versionCode\s+(\d+)', s)
          if not m:
              raise SystemExit('Could not find versionCode')
          old_code = int(m.group(1))
          s = re.sub(r'versionCode\s+\d+', f'versionCode {old_code + 1}', s, count=1)

          s, n = re.subn(
              r"versionName\s+'1\.1\.8-ear-guard-candidate'",
              "versionName '1.1.8-ear-guard-icon-fit-v2'",
              s, count=1
          )
          if n != 1:
              raise SystemExit('Could not patch 1.1.8 versionName')
          gradle.write_text(s)

          manifest = Path('app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = s.replace(
              'android:label="Pretty Pink Ear Guard"',
              'android:label="Pretty Pink 1.1.8 Icon Fit"',
              1
          )

          if re.search(r'android:icon="[^"]+"', s):
              s = re.sub(r'android:icon="[^"]+"',
                         'android:icon="@mipmap/launcher"', s, count=1)
          else:
              s = s.replace('<application',
                            '<application android:icon="@mipmap/launcher"', 1)

          if re.search(r'android:roundIcon="[^"]+"', s):
              s = re.sub(r'android:roundIcon="[^"]+"',
                         'android:roundIcon="@mipmap/launcher"', s, count=1)
          else:
              s = s.replace(
                  'android:icon="@mipmap/launcher"',
                  'android:icon="@mipmap/launcher" android:roundIcon="@mipmap/launcher"',
                  1
              )
          manifest.write_text(s)

          # Legacy launchers: fitted bitmap fills the icon bounds.
          legacy = Path('app/src/main/res/mipmap-anydpi')
          legacy.mkdir(parents=True, exist_ok=True)
          bitmap = '''<bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/glossy_music_icon"
              android:gravity="fill"
              android:antialias="true"
              android:dither="true"
              android:filter="true" />
          '''
          (legacy / 'launcher.xml').write_text(bitmap)
          (legacy / 'launcher_round.xml').write_text(bitmap)

          # Samsung / Android adaptive icon:
          # Put the FINISHED artwork in the BACKGROUND layer so it fills the mask.
          # Using a completed rounded-square picture as the FOREGROUND is what caused
          # Android to shrink the already-finished icon inside its safe zone.
          drawable = Path('app/src/main/res/drawable')
          drawable.mkdir(parents=True, exist_ok=True)
          fill = '''<bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/glossy_music_icon"
              android:gravity="fill"
              android:antialias="true"
              android:dither="true"
              android:filter="true" />
          '''
          (drawable / 'glossy_launcher_fill.xml').write_text(fill)

          adaptive = Path('app/src/main/res/mipmap-anydpi-v26')
          adaptive.mkdir(parents=True, exist_ok=True)
          adaptive_xml = '''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/glossy_launcher_fill"/>
              <foreground android:drawable="@android:color/transparent"/>
          </adaptive-icon>
          '''
          (adaptive / 'launcher.xml').write_text(adaptive_xml)
          (adaptive / 'launcher_round.xml').write_text(adaptive_xml)

          Path('GITHUB-1.1.8-ICON-FIT-V2-NOTES.md').write_text(
              '# Pretty Pink 1.1.8 Ear Guard Icon Fit v2\n\n'
              'Launcher-only Samsung fit test built from the exact tested 1.1.8 '
              'Ear Guard source. Audio code and in-app UI resources are protected '
              'before and after the patch. The finished glossy artwork is used as '
              'the adaptive background so Android does not safe-zone-shrink it as '
              'a foreground image.\n'
          )
          PY

          python3 /tmp/icon_patch.py
          rm -f /tmp/icon_patch.py

      - name: Prove audio and in-app resources are byte-for-byte unchanged
        shell: bash
        run: |
          sha256sum -c /tmp/java-before.sha256
          sha256sum -c /tmp/res-before.sha256
          grep -Fq "applicationId 'com.prettypink.player.earguard.iconfitv2'" app/build.gradle
          grep -Fq "versionName '1.1.8-ear-guard-icon-fit-v2'" app/build.gradle
          grep -Fq 'android:icon="@mipmap/launcher"' app/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@mipmap/launcher"' app/src/main/AndroidManifest.xml
          grep -Fq '@drawable/glossy_launcher_fill' app/src/main/res/mipmap-anydpi-v26/launcher.xml
          grep -Fq '@android:color/transparent' app/src/main/res/mipmap-anydpi-v26/launcher.xml
          echo 'PASS exact 1.1.8 sound + in-app UI preserved; launcher-only patch verified'

      - name: Refuse private keys or test music
        shell: bash
        run: |
          if find . -type f \( -iname '*.p12' -o -iname '*.jks' -o -iname '*.keystore' -o -iname '*.flac' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.wav' \) -print -quit | grep -q .; then
            echo 'Refusing to build: private key or test media found in candidate workspace.' >&2
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Ensure Android SDK 35 is installed
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build isolated debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name and hash APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pretty-Pink-1.1.8-Ear-Guard-Icon-Fit-v2.apk
          sha256sum Pretty-Pink-1.1.8-Ear-Guard-Icon-Fit-v2.apk > Pretty-Pink-1.1.8-Ear-Guard-Icon-Fit-v2.sha256
          cat Pretty-Pink-1.1.8-Ear-Guard-Icon-Fit-v2.sha256

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Pretty-Pink-1.1.8-Ear-Guard-Icon-Fit-v2
          path: |
            Pretty-Pink-1.1.8-Ear-Guard-Icon-Fit-v2.apk
            Pretty-Pink-1.1.8-Ear-Guard-Icon-Fit-v2.sha256
          if-no-files-found: error
          retention-days: 7
