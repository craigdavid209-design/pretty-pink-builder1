name: Pretty Pink 1.1.7 Comfort Restore

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/Pretty-Pink-1.1.7-Comfort-Restore-GitHub-Builder-v2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out builder repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Python test dependency
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'numpy==2.1.3'

      - name: Restore exact 1.1.6 freeze-candidate source
        shell: bash
        run: |
          awk '/cat > source.tar.xz.b64/{flag=1;next} flag && /PRETTY_PINK_SOURCE/{exit} flag {sub(/^          /,""); print}' \
            .github/workflows/Pretty-Pink-1.1.6-Freeze-Candidate-GitHub-Builder.yml > source.tar.xz.b64
          base64 -d source.tar.xz.b64 > source.tar.xz
          tar -xJf source.tar.xz
          rm -f source.tar.xz source.tar.xz.b64

      - name: Apply human-ear comfort restore
        shell: bash
        run: |
          cat > /tmp/comfort_restore.py <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'comfort-restore anchor missing: {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))

          replace('app/build.gradle',
              "applicationId 'com.prettypink.player.freezecandidate'; minSdk 26; targetSdk 35; versionCode 54; versionName '1.1.6-freeze-candidate'",
              "applicationId 'com.prettypink.player.comfortrestore'; minSdk 26; targetSdk 35; versionCode 55; versionName '1.1.7-comfort-restore'")
          replace('app/src/main/AndroidManifest.xml',
              'android:versionCode="54" android:versionName="1.1.6-freeze-candidate"',
              'android:versionCode="55" android:versionName="1.1.7-comfort-restore"')
          replace('app/src/main/AndroidManifest.xml',
              'android:label="Pretty Pink Freeze Candidate"',
              'android:label="Pretty Pink Comfort Restore"')

          # Human-ear regression fix: 1.1.6 made hot material too exposed by
          # requiring too much persistence. Restore the proven 1.1.5 confidence
          # ladder while keeping every 1.1.6 safety/cache hardening change.
          replace('app/src/main/java/com/prettypink/player/GainPolicy.java',
          '''                // Balance is a macro-dynamics layer, not a transient shaper.\n                // Overlapping 400 ms windows can make a very short spike look\n                // artificially persistent, so confidence rises smoothly only\n                // when hot evidence persists across the surrounding second.\n                double confidence = smooth((hotWindows - 3.0) / 6.0);''',
          '''                // Human-ear regression: the stricter 1.1.6 persistence weighting\n                // could leave genuinely hot material too exposed, especially in\n                // Soft Glow. Restore the proven 1.1.5 confidence ladder: isolated\n                // events need strong excess, while repeated hot windows earn\n                // confidence sooner. This remains attenuation-only and bounded.\n                double confidence = hotWindows >= 3 ? 1.0\n                        : hotWindows == 2 ? .75\n                        : hotWindows == 1 && excess >= 2.5 ? .45 : 0.0;''')

          replace('app/src/main/java/com/prettypink/player/MainActivity.java',
              'Jane And David Edition · 1.1.6 Freeze Candidate',
              'Jane And David Edition · 1.1.7 Comfort Restore')
          replace('app/src/main/java/com/prettypink/player/MainActivity.java',
              'Predictive Balance is prepared from the verified portrait, never lifts quiet passages, and weights hot-event confidence by persistence so brief transients preferentially stay the record’s own.',
              'Predictive Balance is prepared from the verified portrait and never lifts quiet passages. Ordinary fluctuations are ignored; unusually hot events need strong evidence, while repeated hot windows earn confidence sooner.')

          # Replace the experimental 1.1.6 transient-suppression assertion with
          # the invariant we actually promise: finite, bounded attenuation only.
          replace('tests/BalanceCurveCheck.java',
          '''  double[] transientOnly=song(30,-18);Arrays.fill(transientOnly,150,153,energy(-9));double[] transientCurve=GainPolicy.buildBalanceCurve(Loudness.integrated(transientOnly),transientOnly);\n  double transientMin=0;for(double v:transientCurve)transientMin=Math.min(transientMin,v);\n  check(transientMin>=-.05,"brief moderate transient must stay below meaningful Balance movement");\n''',
          '''  double[] transientOnly=song(30,-18);Arrays.fill(transientOnly,150,153,energy(-9));double[] transientCurve=GainPolicy.buildBalanceCurve(Loudness.integrated(transientOnly),transientOnly);\n  for(double v:transientCurve)check(Double.isFinite(v)&&v>=-1.000001&&v<=0.000001,"transient response must remain finite and attenuation-only");\n''')

          Path('COMFORT-RESTORE-NOTES.md').write_text('''# Pretty Pink 1.1.7 Comfort Restore\n\nHuman-ear regression fix after 1.1.6 Freeze Candidate.\n\n- Restores the proven 1.1.5 Predictive Balance confidence ladder.\n- Keeps 1.1.6 measurement schema 5 / float-first cache truth.\n- Keeps 1.1.6 fail-closed gain transport hardening.\n- No change to Everyday (-18 LUFS), Soft Glow (-23 LUFS), Comfort coefficients, peak ceiling, Album Intent, or Balance cap.\n\nReason: 1.1.6 persistence weighting made Soft Glow audibly too open/exposed on real listening. The ear test outranks the synthetic preference.\n\nGoal: 1.1.5 comfort + 1.1.6 correctness.\n''')
          PY
          python3 /tmp/comfort_restore.py
          rm -f /tmp/comfort_restore.py

      - name: Verify comfort-restore identity and invariants
        shell: bash
        run: |
          grep -Fq "versionName '1.1.7-comfort-restore'" app/build.gradle
          grep -Fq 'android:label="Pretty Pink Comfort Restore"' app/src/main/AndroidManifest.xml
          grep -Fq 'MEASUREMENT_SCHEMA_VERSION=5' app/src/main/java/com/prettypink/player/AnalysisCache.java
          grep -Fq 'hotWindows >= 3 ? 1.0' app/src/main/java/com/prettypink/player/GainPolicy.java
          grep -Fq 'if (!Double.isFinite(current)) return PrettyPink.FALLBACK_ATTENUATION_DB;' app/src/main/java/com/prettypink/player/GainPolicy.java
          grep -Fq 'case -23' app/src/main/java/com/prettypink/player/PlayerService.java || true
          ! grep -R "versionName '1.1.6-freeze-candidate'" app/build.gradle

      - name: Run host policy and math checks
        shell: bash
        run: |
          export JAVA_HOME="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(command -v java))))}"
          python3 tests/verify.py
          python3 tests/verify_extended.py
          mkdir -p /tmp/pp117check
          SRC=app/src/main/java/com/prettypink/player
          javac --release 8 -d /tmp/pp117check \
            "$SRC/PrettyPink.java" "$SRC/GainPolicy.java" "$SRC/ScanResult.java" \
            "$SRC/Loudness.java" "$SRC/PeakMeter.java" "$SRC/AlbumPolicy.java" \
            tests/BalanceCurveCheck.java tests/V03IntegrationCheck.java
          java -cp /tmp/pp117check com.prettypink.player.BalanceCurveCheck
          java -cp /tmp/pp117check com.prettypink.player.V03IntegrationCheck

      - name: Refuse private keys or test music
        shell: bash
        run: |
          if find . -type f \( -iname '*.p12' -o -iname '*.jks' -o -iname '*.keystore' -o -iname '*.flac' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.wav' \) -print -quit | grep -q .; then
            echo 'Refusing to build: private key or test media found in candidate workspace.' >&2
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Ensure Android SDK 35 is installed
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build isolated debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name and hash the APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pretty-Pink-1.1.7-Comfort-Restore.apk
          sha256sum Pretty-Pink-1.1.7-Comfort-Restore.apk > Pretty-Pink-1.1.7-Comfort-Restore.sha256
          cat Pretty-Pink-1.1.7-Comfort-Restore.sha256

      - name: Upload the APK and checksum
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Pretty-Pink-1.1.7-Comfort-Restore
          path: |
            Pretty-Pink-1.1.7-Comfort-Restore.apk
            Pretty-Pink-1.1.7-Comfort-Restore.sha256
          if-no-files-found: error
          retention-days: 7
