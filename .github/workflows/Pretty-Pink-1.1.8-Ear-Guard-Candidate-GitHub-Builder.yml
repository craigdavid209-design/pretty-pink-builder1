      - name: Verify Ear Guard identity and invariants
        shell: bash
        run: |
          grep -Fq "applicationId 'com.prettypink.player.earguard'" app/build.gradle
          grep -Fq "versionName '1.1.8-ear-guard-candidate'" app/build.gradle
          grep -Fq 'android:label="Pretty Pink Ear Guard"' app/src/main/AndroidManifest.xml
          grep -Fq 'MEASUREMENT_SCHEMA_VERSION=5' app/src/main/java/com/prettypink/player/AnalysisCache.java
          grep -Fq 'section + 1.80' app/src/main/java/com/prettypink/player/GainPolicy.java
          grep -Fq 'fastExcess * .55 * fastConfidence' app/src/main/java/com/prettypink/player/GainPolicy.java
          grep -Fq 'target <= -20.0 ? 0.85 : 1.0' app/src/main/java/com/prettypink/player/GainPolicy.java
          grep -Fq 'Math.min(.85, fastExcess' app/src/main/java/com/prettypink/player/GainPolicy.java
          grep -Fq 'final double attackPerSecond = .20;' app/src/main/java/com/prettypink/player/GainPolicy.java
          grep -Fq 'final double releasePerSecond = .10;' app/src/main/java/com/prettypink/player/GainPolicy.java

      - name: Run full host math and reference suite
        shell: bash
        run: |
          python3 tests/verify.py
          python3 tests/verify_extended.py
          mkdir -p /tmp/pp118check
          SRC=app/src/main/java/com/prettypink/player
          javac --release 8 -d /tmp/pp118check \
            "$SRC/PrettyPink.java" "$SRC/GainPolicy.java" "$SRC/ScanResult.java" \
            "$SRC/Loudness.java" "$SRC/PeakMeter.java" "$SRC/AlbumPolicy.java" \
            tests/BalanceCurveCheck.java tests/V03IntegrationCheck.java tests/EarGuardCheck.java
          java -cp /tmp/pp118check com.prettypink.player.BalanceCurveCheck
          java -cp /tmp/pp118check com.prettypink.player.V03IntegrationCheck
          java -cp /tmp/pp118check com.prettypink.player.EarGuardCheck

      - name: Refuse private keys or test music
        shell: bash
        run: |
          if find . -type f \( -iname '*.p12' -o -iname '*.jks' -o -iname '*.keystore' -o -iname '*.flac' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.wav' \) -print -quit | grep -q .; then
            echo 'Refusing to build: private key or test media found in candidate workspace.' >&2
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Ensure Android SDK 35 is installed
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build isolated debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name and hash the APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pretty-Pink-1.1.8-Ear-Guard-Candidate.apk
          sha256sum Pretty-Pink-1.1.8-Ear-Guard-Candidate.apk > Pretty-Pink-1.1.8-Ear-Guard-Candidate.sha256
          cat Pretty-Pink-1.1.8-Ear-Guard-Candidate.sha256

      - name: Upload the APK and checksum
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Pretty-Pink-1.1.8-Ear-Guard-Candidate
          path: |
            Pretty-Pink-1.1.8-Ear-Guard-Candidate.apk
            Pretty-Pink-1.1.8-Ear-Guard-Candidate.sha256
          if-no-files-found: error
          retention-days: 7
