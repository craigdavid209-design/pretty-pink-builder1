name: Pretty Pink 1.1.8 Ear Guard Candidate

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/Pretty-Pink-1.1.8-Ear-Guard-Candidate-GitHub-Builder.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out builder repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Python test dependency
        shell: bash
        run: |
          python3 -m venv /tmp/pp-test-venv
          /tmp/pp-test-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir 'numpy==2.1.3'
          echo "/tmp/pp-test-venv/bin" >> "$GITHUB_PATH"

      - name: Ensure FFmpeg reference tool is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

